name: gitleaks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Top-level permissions default to read-all; gitleaks uploads its
# SARIF report using the default GITHUB_TOKEN, so it needs no extra
# scope.
permissions: read-all

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@f65dee2ef48e96e7a5a2b775b131c3d81b2e73ea # v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
