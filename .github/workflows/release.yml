name: Release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Auto-tag on release merge"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Resolve tag from commit
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and SHA
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${{ github.ref_name }}"
            sha="${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            sha=$(git rev-list -n1 "$tag")
          else
            sha="${{ github.event.workflow_run.head_sha }}"
            tag=$(git ls-remote --tags origin \
              | awk -v s="$sha" '$1 == s && $2 ~ /^refs\/tags\/v[0-9]/ {sub("refs/tags/","", $2); sub(/\^\{\}$/,"", $2); print $2}' \
              | head -n1)
            if [[ -z "$tag" ]]; then
              echo "No semver tag found for sha=$sha — skipping release"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag sha=$sha"

  verify-ci:
    name: Verify CI is green
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    steps:
      - name: Wait for CI workflow result on tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          sha="${{ needs.resolve-tag.outputs.sha }}"
          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&per_page=50"

          echo "Checking CI status for ${repo}@${sha}"

          for attempt in {1..30}; do
            json=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}")

            ci_status=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .status' | head -n1)
            ci_conclusion=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .conclusion' | head -n1)

            if [[ -z "${ci_status}" ]]; then
              echo "Attempt ${attempt}/30: CI workflow run not found yet; waiting..."
              sleep 20
              continue
            fi

            if [[ "${ci_status}" != "completed" ]]; then
              echo "Attempt ${attempt}/30: CI is ${ci_status}; waiting..."
              sleep 20
              continue
            fi

            if [[ "${ci_conclusion}" == "success" ]]; then
              echo "CI completed successfully for ${sha}"
              exit 0
            fi

            echo "CI did not pass for ${sha}: conclusion=${ci_conclusion}"
            exit 1
          done

          echo "Timed out waiting for CI completion on ${sha}"
          exit 1

  validate:
    name: Validate tag vs Cargo versions
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crate versions match tag
        run: |
          TAG_VERSION="${{ needs.resolve-tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          for crate in papertowel papertowel-mcp; do
            CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
              echo "Version mismatch in $crate: Cargo.toml has $CARGO_VERSION, tag is v$TAG_VERSION"
              exit 1
            fi
          done
          echo "All crate versions match tag v$TAG_VERSION ✓"

  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs: [resolve-tag, verify-ci, validate]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Publish papertowel
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "papertowel") | .version')
          if cargo search papertowel --limit 1 2>/dev/null | grep -q "^papertowel = \"$VERSION\""; then
            echo "papertowel@$VERSION already published, skipping"
          else
            cargo publish -p papertowel
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index propagation
        run: sleep 30

      - name: Publish papertowel-mcp
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "papertowel-mcp") | .version')
          if cargo search papertowel-mcp --limit 1 2>/dev/null | grep -q "^papertowel-mcp = \"$VERSION\""; then
            echo "papertowel-mcp@$VERSION already published, skipping"
          else
            cargo publish -p papertowel-mcp
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
