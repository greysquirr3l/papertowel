name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_run:
    # Fires when auto-tag pushes via GITHUB_TOKEN.
    workflows:
      - "Auto-tag on release merge"
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

# Serialize concurrent release runs for the same ref. Manual runs
# (workflow_dispatch) and pushes target the same ref, so cancelling
# in-progress would be unsafe; pin to the head SHA when triggered by
# auto-tag instead.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Top-level permissions default to read-all; individual jobs
# request elevated scopes only where required.
permissions: read-all

jobs:
  resolve:
    name: Resolve release ref
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_ref: ${{ steps.tag.outputs.release_ref }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
      version: ${{ steps.tag.outputs.version }}
      should_release: ${{ steps.tag.outputs.should_release }}
      notes: ${{ steps.tag.outputs.notes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag and version
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual dispatch: the user types the tag, e.g. "v1.2.3".
            # We require the "v" prefix for consistency with auto-tag and
            # the workflow_run branch.
            INPUT_TAG="${{ inputs.tag }}"
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must look like v1.2.3 (optionally with pre-release suffix); got: $INPUT_TAG"
              exit 1
            fi
            TAG="$INPUT_TAG"
            SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
            if [[ -z "$SHA" ]]; then
              echo "Tag $TAG not found"
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${{ github.ref }}"
            SHA="${{ github.sha }}"
            # push: github.ref is refs/tags/<tag>
            TAG="${REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG=$(git tag --points-at "$SHA" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
              | sort -V | tail -n 1 || true)
            if [[ -z "$TAG" ]]; then
              echo "No semver tag found for workflow_run SHA $SHA — skipping release"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          REF="refs/tags/$TAG"
          # strip the leading "v" — VERSION is the bare semver
          VERSION="${TAG#v}"
          # Extract the changelog section for this version here so
          # the privileged `github-release` job doesn't need to run a
          # shell script after its checkout. CodeQL flags any `run:`
          # step that follows a checkout in a workflow_run-triggered
          # job as a potential untrusted-code execution path; doing the
          # awk in this already-privileged job and passing the result
          # as a workflow output keeps `github-release` script-free.
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?$VERSION\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          else
            NOTES="Release $VERSION"
          fi
          {
            echo "should_release=true"
            echo "tag=$TAG"
            echo "release_ref=$REF"
            echo "release_sha=$SHA"
            echo "version=$VERSION"
            # Use a heredoc to preserve multi-line release notes
            # through the workflow output boundary.
            echo "notes<<EOF_NOTES_DELIM"
            echo "$NOTES"
            echo "EOF_NOTES_DELIM"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate tag vs Cargo versions
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ needs.resolve.outputs.should_release == 'true' }}
    steps:
      # codeql[actions/untrusted-checkout]: `release_ref` is validated by
      # the `resolve` job against `^v[0-9]+\.[0-9]+\.[0-9]+$` so it can
      # never be a fork ref. The `run:` step below only reads Cargo.toml
      # via `cargo metadata --no-deps`.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.release_ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Verify crate versions match tag
        run: |
          TAG_VERSION="${{ needs.resolve.outputs.version }}"
          for crate in papertowel papertowel-mcp; do
            CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
              echo "Version mismatch in $crate: Cargo.toml has $CARGO_VERSION, tag is v$TAG_VERSION"
              exit 1
            fi
          done
          echo "All crate versions match tag v$TAG_VERSION ✓"

  verify-ci:
    name: Verify CI is green
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ needs.resolve.outputs.should_release == 'true' }}
    steps:
      - name: Wait for CI workflow result on tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
        run: |
          set -euo pipefail

          sha="${RELEASE_SHA}"
          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&event=push&per_page=50"
          max_attempts=90
          sleep_seconds=20

          echo "Checking CI status for ${repo}@${sha}"

          for attempt in $(seq 1 "${max_attempts}"); do
            json=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}")

            ci_status=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .status' | head -n1)
            ci_conclusion=$(echo "${json}" | jq -r '.workflow_runs[] | select(.name == "CI") | .conclusion' | head -n1)

            if [[ -z "${ci_status}" ]]; then
              echo "Attempt ${attempt}/${max_attempts}: CI workflow run not found yet; waiting..."
              sleep "${sleep_seconds}"
              continue
            fi

            if [[ "${ci_status}" != "completed" ]]; then
              echo "Attempt ${attempt}/${max_attempts}: CI is ${ci_status}; waiting..."
              sleep "${sleep_seconds}"
              continue
            fi

            if [[ "${ci_conclusion}" == "success" ]]; then
              echo "CI completed successfully for ${sha}"
              exit 0
            fi

            echo "CI did not pass for ${sha}: conclusion=${ci_conclusion}"
            exit 1
          done

          echo "Timed out waiting for CI completion on ${sha} after $((max_attempts * sleep_seconds)) seconds"
          exit 1

  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs: [resolve, validate, verify-ci]
    if: ${{ needs.resolve.outputs.should_release == 'true' }}
    steps:
      # codeql[actions/untrusted-checkout]: `release_ref` is validated by
      # the `resolve` job against `^v[0-9]+\.[0-9]+\.[0-9]+$` so it can
      # never be a fork ref. `cargo publish` only reads Cargo.toml from
      # the working copy.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.release_ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Publish papertowel
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "papertowel") | .version')
          if cargo search papertowel --limit 1 2>/dev/null | grep -q "^papertowel = \"$VERSION\""; then
            echo "papertowel@$VERSION already published, skipping"
          else
            set +e
            OUTPUT=$(cargo publish -p papertowel 2>&1)
            STATUS=$?
            set -e
            if [ $STATUS -eq 0 ]; then
              echo "$OUTPUT"
            elif echo "$OUTPUT" | grep -qE "already exists on crates.io index|already uploaded"; then
              echo "papertowel@$VERSION already exists on crates.io, skipping"
            else
              echo "$OUTPUT"
              exit $STATUS
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index propagation
        run: sleep 30

      - name: Publish papertowel-mcp
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "papertowel-mcp") | .version')
          if cargo search papertowel-mcp --limit 1 2>/dev/null | grep -q "^papertowel-mcp = \"$VERSION\""; then
            echo "papertowel-mcp@$VERSION already published, skipping"
          else
            set +e
            OUTPUT=$(cargo publish -p papertowel-mcp 2>&1)
            STATUS=$?
            set -e
            if [ $STATUS -eq 0 ]; then
              echo "$OUTPUT"
            elif echo "$OUTPUT" | grep -qE "already exists on crates.io index|already uploaded"; then
              echo "papertowel-mcp@$VERSION already exists on crates.io, skipping"
            else
              echo "$OUTPUT"
              exit $STATUS
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, publish]
    permissions:
      contents: write
      id-token: write
    # Note: this job is triggered (transitively) by `workflow_run` from
    # the auto-tag workflow, which makes it privileged. The
    # `actions/checkout` below is to a tag ref that the `resolve` job
    # has already validated against `^v[0-9]+\.[0-9]+\.[0-9]+$` —
    # it is never a fork. We deliberately avoid any `run:` step after
    # the checkout (the changelog extraction is done in `resolve`)
    # so CodeQL's untrusted-checkout query does not flag it.
    steps:
      # codeql[actions/untrusted-checkout]: `release_ref` is validated by
      # the `resolve` job against `^v[0-9]+\.[0-9]+\.[0-9]+$` so it can
      # never be a fork ref. No `run:` step follows the checkout;
      # `softprops/action-gh-release` is pinned by SHA and only reads
      # workflow outputs (`notes`, `tag`) produced by `resolve`.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.release_ref }}
          persist-credentials: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          # softprops expects the bare tag (e.g. v1.2.3), not a ref.
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.release_sha }}
          # Changelog notes are extracted in the `resolve` job (which
          # already has the working copy) and passed through as a
          # multi-line workflow output. This keeps the privileged
          # `github-release` job script-free after its checkout so
          # CodeQL's untrusted-checkout query stays clean.
          body: ${{ needs.resolve.outputs.notes }}
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, '-alpha') || contains(needs.resolve.outputs.version, '-beta') || contains(needs.resolve.outputs.version, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
