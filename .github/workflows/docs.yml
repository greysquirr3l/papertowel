name: papertowel-docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'book/**'
      - '.github/workflows/docs.yml'

# Top-level permissions default to read-all; the deploy job
# needs pages: write and id-token: write to publish to GitHub Pages.
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mdBook
        run: |
          MDBOOK_VER=v0.5.2
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VER}/mdbook-${MDBOOK_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --directory /usr/local/bin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build mdBook
        run: mdbook build book

      - name: Build Rustdoc
        run: |
          cargo doc --no-deps
          mkdir -p book/book/api
          cp -r target/doc/* book/book/api/
          echo '<html><head><meta http-equiv="refresh" content="0; url=papertowel/index.html"></head></html>' > book/book/api/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
