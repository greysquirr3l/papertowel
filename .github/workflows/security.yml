name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  CARGO_AUDIT_VERSION: "0.22.1"
  CARGO_DENY_VERSION: "0.19.4"

# Top-level permissions default to read-all; individual jobs
# request elevated scopes only where required.
permissions: read-all

jobs:
  cargo-audit:
    name: Audit dependencies for CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache cargo tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tools-audit-${{ env.CARGO_AUDIT_VERSION }}
          restore-keys: ${{ runner.os }}-cargo-tools-audit-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force --version "${CARGO_AUDIT_VERSION}"

      - name: Run cargo audit
        run: cargo audit

  cargo-deny:
    name: Check licenses and bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache cargo tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tools-deny-${{ env.CARGO_DENY_VERSION }}
          restore-keys: ${{ runner.os }}-cargo-tools-deny-

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --force --version "${CARGO_DENY_VERSION}"

      - name: Run cargo deny
        run: cargo deny check
