name: Auto-tag on release merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Top-level permissions default to read-all; the only job needs
# `contents: write` (declared at the job level). This narrows the
# blast radius of a compromised action and satisfies the
# TokenPermissionsID scorecard check.
permissions: read-all

jobs:
  tag:
    name: Push version tag if missing
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Don't persist GITHUB_TOKEN as a git credential. The checked-out
          # commit's Cargo.toml is later read by `cargo metadata`, which
          # doesn't execute build.rs — but a malicious build.rs would still
          # be able to push with the token if we kept it on disk.
          persist-credentials: false

      - name: Gate on release commit
        id: gate
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == chore\(release\):* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read workspace version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "papertowel") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.gate.outputs.run == 'true'
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'false'
        env:
          # The checkout above set persist-credentials: false, so the
          # token-based git credential isn't stored. Embed the token in
          # the push URL for this one-shot push; the credential isn't
          # persisted to the git config.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git push "${REMOTE}" "${{ steps.version.outputs.tag }}"; then
            echo "Pushed ${{ steps.version.outputs.tag }}"
            exit 0
          fi

          # If a manual push raced us, treat that as success.
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "Tag ${{ steps.version.outputs.tag }} was created concurrently; continuing"
            exit 0
          fi

          echo "Failed to push tag ${{ steps.version.outputs.tag }}"
          exit 1

      - name: Tag already exists
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping"

      - name: Not a release commit
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "Skipping auto-tag: head commit is not a release commit"
